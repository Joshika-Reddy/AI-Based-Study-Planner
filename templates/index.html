<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Planner</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#0f172a,#1e3a8a);
            margin:0;
            padding:20px;
        }

        .container{
            max-width:900px;
            margin:auto;
            background:white;
            padding:25px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,0.3);
        }

        h1{
            text-align:center;
            color:#1e3a8a;
        }

        .subject-row{
            display:flex;
            gap:10px;
            margin-bottom:10px;
            flex-wrap:wrap;
        }

        input,select{
            padding:10px;
            border:1px solid #ccc;
            border-radius:8px;
            flex:1;
        }

        button{
            padding:10px 15px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            color:white;
        }

        .add-btn{
            background:#10b981;
        }

        .submit-btn{
            background:#2563eb;
        }

        ul{
            margin-top:15px;
        }

        canvas{
            margin-top:20px;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>📚 AI Study Planner</h1>

    <form method="POST">

        <div id="subjects-container">

            <div class="subject-row">
                <input type="text" name="subject" placeholder="Subject" required>

                <input type="number"
                       name="marks"
                       placeholder="Marks"
                       min="0"
                       max="100"
                       required>

                <select name="difficulty">
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>

        </div>

        <button type="button"
                class="add-btn"
                onclick="addSubject()">
            + Add Subject
        </button>

        <br><br>

        <input type="number"
               name="total_hours"
               placeholder="Total Study Hours"
               step="0.5"
               required>

        <br><br>

        <button type="submit"
                class="submit-btn">
            Generate Study Plan
        </button>

    </form>

    {% if study_plan %}

    <h2>Study Plan</h2>

    <ul>
        {% for subject, hours in study_plan.items() %}
        <li><strong>{{ subject }}</strong> : {{ hours }} Hours</li>
        {% endfor %}
    </ul>

    <!-- Store Flask data safely -->
    <script id="study-data" type="application/json">
        {{ study_plan | tojson }}
    </script>

    <canvas id="studyChart"></canvas>

    <script>
        const studyData = JSON.parse(
            document.getElementById("study-data").textContent
        );

        const subjects = Object.keys(studyData);
        const hours = Object.values(studyData);

        new Chart(document.getElementById("studyChart"), {
            type: "bar",
            data: {
                labels: subjects,
                datasets: [{
                    label: "Study Hours",
                    data: hours,
                    backgroundColor: [
                        "#3B82F6",
                        "#10B981",
                        "#F59E0B",
                        "#EF4444",
                        "#8B5CF6",
                        "#06B6D4",
                        "#EC4899"
                    ]
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>

    {% endif %}

</div>

<script>
function addSubject() {

    const container =
        document.getElementById("subjects-container");

    const row =
        document.createElement("div");

    row.className = "subject-row";

    row.innerHTML = `
        <input type="text"
               name="subject"
               placeholder="Subject"
               required>

        <input type="number"
               name="marks"
               placeholder="Marks"
               min="0"
               max="100"
               required>

        <select name="difficulty">
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
        </select>
    `;

    container.appendChild(row);
}
</script>

</body>
</html>
